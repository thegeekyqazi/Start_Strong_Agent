[project]
name = "strongstart-workspace"
version = "0.1.0"
description = "Strong Start grant workspace monorepo root (not an installable package)."
requires-python = ">=3.12,<3.14"
dependencies = ["strongstart-api", "strongstart-contracts"]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.8",
    "mypy>=1.13",
    "httpx>=0.28",
    "hypothesis>=6.170.15",
]
browser = ["playwright>=1.49"]

[tool.uv]
package = false
default-groups = ["dev", "browser"]

[tool.uv.workspace]
members = ["services/api", "packages/contracts/python"]

[tool.uv.sources]
strongstart-api = { workspace = true }
strongstart-contracts = { workspace = true }

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["apps", "packages/contracts/ts", "node_modules"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "N", "RUF"]
ignore = ["S101", "N818"]

[tool.ruff.lint.isort]
known-first-party = ["strongstart_api", "strongstart_contracts", "scripts", "tests"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106", "S108"]
"migrations/**" = ["N999"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
mypy_path = ["services/api/src", "packages/contracts/python/src"]
files = ["services/api/src", "packages/contracts/python/src", "scripts", "tests", "migrations"]

[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_defs = false
disallow_incomplete_defs = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers -m 'not db and not browser'"
filterwarnings = ["ignore:Using `httpx` with `starlette.testclient`"]
markers = [
    "db: requires the local PostgreSQL service (make db-up)",
    "browser: requires installed Playwright Chromium (make browser-install)",
]
