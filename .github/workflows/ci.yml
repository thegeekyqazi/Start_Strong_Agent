# No-secret CI using the repo's actual commands. No deployment, no PR merging.
# Action versions pinned by commit SHA (tags noted) - SEC-11 bootstrap boundary.
name: ci
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: python (ruff, mypy, pytest)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: '0.12.23'
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      - run: uv run pytest

  web:
    name: web (oxlint, prettier, tsc, vitest, build)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  contracts:
    name: contracts (schema + TS drift)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: '0.12.23'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: uv sync --locked
      - run: npm ci
      - run: make contracts-check

  db-smoke:
    name: db smoke (migrate, C transactions, process races, readiness)
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17.11-alpine
        env:
          POSTGRES_DB: strongstart
          POSTGRES_USER: strongstart
          POSTGRES_PASSWORD: strongstart_ci_only
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U strongstart -d strongstart"
          --health-interval 2s --health-timeout 3s --health-retries 30
    env:
      STRONGSTART_ENVIRONMENT: test
      STRONGSTART_DATABASE_URL: postgresql+psycopg://strongstart:strongstart_ci_only@127.0.0.1:5432/strongstart
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: '0.12.23'
      - run: uv sync --locked
      - run: make smoke
        env:
          DATA001_LOCAL_PG_CONTAINER: ${{ job.services.postgres.id }}

  browser:
    name: browser readiness (Playwright Chromium)
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17.11-alpine
        env:
          POSTGRES_DB: strongstart
          POSTGRES_USER: strongstart
          POSTGRES_PASSWORD: strongstart_ci_only
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U strongstart -d strongstart"
          --health-interval 2s --health-timeout 3s --health-retries 30
    env:
      STRONGSTART_ENVIRONMENT: test
      STRONGSTART_DATABASE_URL: postgresql+psycopg://strongstart:strongstart_ci_only@127.0.0.1:5432/strongstart
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: '0.12.23'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: uv sync --locked
      - run: npm ci
      - run: uv run playwright install --with-deps chromium
      - run: make browser-smoke
