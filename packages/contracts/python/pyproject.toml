[project]
name = "strongstart-contracts"
version = "0.1.0"
description = "Canonical shared Pydantic contracts, errors and port protocols for Strong Start."
requires-python = ">=3.12,<3.14"
dependencies = ["pydantic>=2.9"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/strongstart_contracts"]
